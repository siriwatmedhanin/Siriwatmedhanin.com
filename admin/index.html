<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>ระบบจัดการเนื้อหา (CMS) | Siriwatmedhanin Group</title>
  <link rel="icon" type="image/png" href="../assets/images/logo-smg-11.png" />
  
  <link href="/admin/config.yml" type="application/yaml" rel="cms-config-url" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Sveltia CMS Core with Embedded Configuration -->
  <script>
    window.CMS_MANUAL_INIT = true;
  </script>
  <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
</head>
<body>
  <script>
    const { CMS } = window;
    CMS.init({
      config: {
        load_config_file: false,
        backend: {
          name: 'github',
          repo: 'siriwatmedhanin/Siriwatmedhanin.com',
          branch: 'main',
          auth_methods: ['token']
        },
        media_folder: 'assets/images',
        public_folder: 'assets/images',
        display_url: 'https://siriwatmedhanin.com',
        logo_url: 'https://siriwatmedhanin.com/assets/images/logo-smg-11.png',
        collections: [
          {
            name: 'contact_settings',
            label: 'ข้อมูลติดต่อและร้านค้า (Contact & Shop)',
            delete: false,
            editor: { preview: false },
            files: [
              {
                name: 'contact',
                label: 'ข้อมูลติดต่อหลัก',
                file: 'content/contact.json',
                format: 'json',
                fields: [
                  { label: 'เบอร์โทรศัพท์ (แสดงผล)', name: 'phone', widget: 'string', default: '091-909-8902' },
                  { label: 'เบอร์โทรศัพท์สำหรับกดโทร (ตัวเลขล้วน)', name: 'phone_raw', widget: 'string', default: '0919098902' },
                  { label: 'อีเมลติดต่อ', name: 'email', widget: 'string', default: 'contact@siriwatmedhanin.com' },
                  { label: 'ที่อยู่สำนักงานใหญ่', name: 'address_th', widget: 'string', default: '115/1 หมู่ที่ 2 ตำบลท่าแค อำเภอเมืองพัทลุง จังหวัดพัทลุง 93000' },
                  { label: 'เลขประจำตัวผู้เสียภาษี', name: 'tax_id', widget: 'string', default: '0935569001087' },
                  { label: 'Facebook Page URL', name: 'facebook_url', widget: 'string', default: 'https://www.facebook.com/share/1FGMbjt1ME/?mibextid=wwXIfr' },
                  { label: 'Messenger URL', name: 'messenger_url', widget: 'string', default: 'https://m.me/61594849079754' },
                  {
                    label: 'ลิงก์ร้านค้าออนไลน์ (Shop Online)',
                    name: 'shop_links',
                    widget: 'object',
                    fields: [
                      { label: 'ตำรับแม่ฉวี - Shopee', name: 'maechawi_shopee', widget: 'string' },
                      { label: 'ตำรับแม่ฉวี - TikTok Shop', name: 'maechawi_tiktok', widget: 'string' },
                      { label: 'ตำรับแม่ฉวี - Thaimart', name: 'maechawi_thaimart', widget: 'string' },
                      { label: 'ตำรับแม่ฉวี - Facebook Shop', name: 'maechawi_facebook', widget: 'string' },
                      { label: 'Sunny Grove - TikTok Shop', name: 'sunnygrove_tiktok', widget: 'string' }
                    ]
                  }
                ]
              }
            ]
          },
          {
            name: 'team_settings',
            label: 'ทีมผู้บริหาร (Executive Team)',
            delete: false,
            editor: { preview: false },
            files: [
              {
                name: 'team',
                label: 'ข้อมูลผู้บริหาร 2 ท่าน',
                file: 'content/team.json',
                format: 'json',
                fields: [
                  {
                    label: 'ผู้บริหารท่านที่ 1 (คุณณัฐชาธรณ์ ศิริวัตร์เมธานินท์)',
                    name: 'exec1',
                    widget: 'object',
                    fields: [
                      { label: 'ชื่อ (ภาษาไทย)', name: 'name_th', widget: 'string' },
                      { label: 'ชื่อ (ภาษาอังกฤษ)', name: 'name_en', widget: 'string' },
                      { label: 'ตำแหน่ง (ภาษาไทย)', name: 'position_th', widget: 'string' },
                      { label: 'ตำแหน่ง (ภาษาอังกฤษ)', name: 'position_en', widget: 'string' },
                      { label: 'สายงาน / แท็ก', name: 'tag_th', widget: 'string' },
                      { label: 'คำคมวิสัยทัศน์', name: 'quote_th', widget: 'text' },
                      { label: 'บทบาทและวิสัยทัศน์', name: 'vision_th', widget: 'text' },
                      { label: 'รูปภาพพอร์ตเทรต', name: 'photo', widget: 'image', choose_url: false }
                    ]
                  },
                  {
                    label: 'ผู้บริหารท่านที่ 2 (คุณวิไลลักษณ์ เพชรคง)',
                    name: 'exec2',
                    widget: 'object',
                    fields: [
                      { label: 'ชื่อ (ภาษาไทย)', name: 'name_th', widget: 'string' },
                      { label: 'ชื่อ (ภาษาอังกฤษ)', name: 'name_en', widget: 'string' },
                      { label: 'ตำแหน่ง (ภาษาไทย)', name: 'position_th', widget: 'string' },
                      { label: 'ตำแหน่ง (ภาษาอังกฤษ)', name: 'position_en', widget: 'string' },
                      { label: 'สายงาน / แท็ก', name: 'tag_th', widget: 'string' },
                      { label: 'คำคมวิสัยทัศน์', name: 'quote_th', widget: 'text' },
                      { label: 'บทบาทและวิสัยทัศน์', name: 'vision_th', widget: 'text' },
                      { label: 'รูปภาพพอร์ตเทรต', name: 'photo', widget: 'image', choose_url: false }
                    ]
                  }
                ]
              }
            ]
          },
          {
            name: 'slides_settings',
            label: 'ภาพสไลด์โชว์ About Us',
            delete: false,
            editor: { preview: false },
            files: [
              {
                name: 'slides',
                label: 'รายการรูปภาพสไลด์โชว์',
                file: 'content/slides.json',
                format: 'json',
                fields: [
                  {
                    label: 'รูปภาพสไลด์ทั้งหมด',
                    name: 'slides',
                    widget: 'list',
                    fields: [
                      { label: 'เลือกรูปภาพ', name: 'image', widget: 'image', choose_url: false },
                      { label: 'คำอธิบายรูป (Alt text)', name: 'alt', widget: 'string' }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      }
    });
  </script>
</body>
</html>
