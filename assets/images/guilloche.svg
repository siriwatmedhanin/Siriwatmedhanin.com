<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="600" height="600" viewBox="0 0 600 600">
  <defs>

    <!-- Hologram iridescent gradient — shifts through spectrum -->
    <linearGradient id="holo1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ff6ec7" stop-opacity="0.55"/>
      <stop offset="16%"  stop-color="#ff4e8a" stop-opacity="0.45"/>
      <stop offset="32%"  stop-color="#ffd700" stop-opacity="0.50"/>
      <stop offset="48%"  stop-color="#7fff7f" stop-opacity="0.40"/>
      <stop offset="64%"  stop-color="#00e5ff" stop-opacity="0.50"/>
      <stop offset="80%"  stop-color="#a78bfa" stop-opacity="0.50"/>
      <stop offset="100%" stop-color="#ff6ec7" stop-opacity="0.45"/>
    </linearGradient>

    <linearGradient id="holo2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#00e5ff" stop-opacity="0.40"/>
      <stop offset="25%"  stop-color="#a78bfa" stop-opacity="0.45"/>
      <stop offset="50%"  stop-color="#ff6ec7" stop-opacity="0.40"/>
      <stop offset="75%"  stop-color="#ffd700" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7fff7f" stop-opacity="0.35"/>
    </linearGradient>

    <linearGradient id="holo3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#ffd700" stop-opacity="0.35"/>
      <stop offset="33%"  stop-color="#ff6ec7" stop-opacity="0.40"/>
      <stop offset="66%"  stop-color="#00e5ff" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Shine overlay -->
    <radialGradient id="shine" cx="35%" cy="30%" r="65%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="60%"  stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.00"/>
    </radialGradient>

  </defs>

  <!-- =====================================================
       GUILLOCHE — Rose / Spirograph curves
       Generated via parametric equations:
       x(t) = (R-r)*cos(t) + d*cos((R-r)/r * t)
       y(t) = (R-r)*sin(t) - d*sin((R-r)/r * t)
       Center: 400,400   Scale: varies per ring
       ===================================================== -->

  <!-- Ring 1 — outermost, 60 petals -->
  <g opacity="0.72" fill="none" stroke="url(#holo1)" stroke-width="0.7">
    <path d="M400,400 m180,0
      C 563,335 537,252 480,220 C 423,188 377,210 360,260
      C 343,310 365,360 400,380 C 435,360 457,310 440,260
      C 423,210 377,188 320,220 C 263,252 237,335 220,400
      C 237,465 263,548 320,580 C 377,612 423,590 440,540
      C 457,490 435,440 400,420 C 365,440 343,490 360,540
      C 377,590 423,612 480,580 C 537,548 563,465 580,400 Z"/>

    <!-- Rhodonea / rose curve r=cos(3θ) scaled to outer ring -->
    <path d="
      M 580,400 C 578,370 565,340 545,318
      C 525,296 498,282 470,278 C 442,274 415,280 393,294
      C 371,308 356,330 352,355 C 348,380 356,406 372,424
      C 388,442 412,452 437,452 C 462,452 486,442 502,424
      C 518,406 526,380 522,355 C 518,330 503,308 481,294
      C 459,280 432,274 404,278 C 376,282 349,296 329,318
      C 309,340 296,370 294,400 C 296,430 309,460 329,482
      C 349,504 376,518 404,522 C 432,526 459,520 481,506
      C 503,492 518,470 522,445 C 526,420 518,394 502,376
      C 486,358 462,348 437,348 C 412,348 388,358 372,376
      C 356,394 348,420 352,445 C 356,470 371,492 393,506
      C 415,520 442,526 470,522 C 498,518 525,504 545,482
      C 565,460 578,430 580,400 Z
    " stroke="url(#holo2)" stroke-width="0.6"/>
  </g>

  <!-- Ring 2 — middle, tighter weave -->
  <g opacity="0.68" fill="none" stroke="url(#holo2)" stroke-width="0.65">
    <path d="
      M 520,400 C 519,378 511,357 497,340 C 483,323 464,312 443,308
      C 422,304 400,308 382,320 C 364,332 352,351 349,373
      C 346,395 352,418 366,434 C 380,450 400,458 421,456
      C 442,454 461,444 473,428 C 485,412 489,391 484,371
      C 479,351 466,335 449,326 C 432,317 411,315 393,322
      C 375,329 361,344 355,363 C 349,382 352,403 363,419
      C 374,435 392,445 412,447 C 432,449 451,442 464,428
      C 477,414 482,394 477,374 C 472,354 458,338 440,330
      C 422,322 400,322 381,330 C 362,338 348,354 343,374
      C 338,394 343,414 356,428 C 369,442 388,449 408,447
      C 428,445 446,435 457,419 C 468,403 471,382 465,363
      C 459,344 445,329 427,322 C 409,315 388,317 371,326
      C 354,335 341,351 336,371 C 331,391 335,412 347,428
      C 359,444 378,454 399,456 C 420,458 440,450 454,434
      C 468,418 474,395 471,373 C 468,351 456,332 438,320
      C 420,308 398,304 377,308 C 356,312 337,323 323,340
      C 309,357 301,378 300,400 C 301,422 309,443 323,460
      C 337,477 356,488 377,492 C 398,496 420,492 438,480
      C 456,468 468,449 471,427 C 474,405 468,382 454,366
      C 440,350 420,342 399,342 C 378,342 358,350 344,366
      C 330,382 324,405 327,427 C 330,449 342,468 360,480
      C 378,492 400,496 421,492 C 442,488 461,477 475,460
      C 489,443 497,422 498,400 Z
    " stroke="url(#holo3)" stroke-width="0.55"/>
  </g>

  <!-- Ring 3 — inner fine weave (Guilloche rosette) -->
  <g opacity="0.60" fill="none" stroke="url(#holo1)" stroke-width="0.5">
    <!-- 24-petal rosette built from ellipses -->
    <ellipse cx="400" cy="400" rx="72" ry="24" transform="rotate(0 400 400)"  stroke="url(#holo1)"/>
    <ellipse cx="400" cy="400" rx="72" ry="24" transform="rotate(15 400 400)" stroke="url(#holo2)"/>
    <ellipse cx="400" cy="400" rx="72" ry="24" transform="rotate(30 400 400)" stroke="url(#holo3)"/>
    <ellipse cx="400" cy="400" rx="72" ry="24" transform="rotate(45 400 400)" stroke="url(#holo1)"/>
    <ellipse cx="400" cy="400" rx="72" ry="24" transform="rotate(60 400 400)" stroke="url(#holo2)"/>
    <ellipse cx="400" cy="400" rx="72" ry="24" transform="rotate(75 400 400)" stroke="url(#holo3)"/>
    <ellipse cx="400" cy="400" rx="72" ry="24" transform="rotate(90 400 400)" stroke="url(#holo1)"/>
    <ellipse cx="400" cy="400" rx="72" ry="24" transform="rotate(105 400 400)" stroke="url(#holo2)"/>
    <ellipse cx="400" cy="400" rx="72" ry="24" transform="rotate(120 400 400)" stroke="url(#holo3)"/>
    <ellipse cx="400" cy="400" rx="72" ry="24" transform="rotate(135 400 400)" stroke="url(#holo1)"/>
    <ellipse cx="400" cy="400" rx="72" ry="24" transform="rotate(150 400 400)" stroke="url(#holo2)"/>
    <ellipse cx="400" cy="400" rx="72" ry="24" transform="rotate(165 400 400)" stroke="url(#holo3)"/>
  </g>

  <!-- Ring 4 — middle-outer spiral weave -->
  <g opacity="0.55" fill="none" stroke-width="0.55">
    <ellipse cx="400" cy="400" rx="130" ry="44" transform="rotate(0  400 400)" stroke="url(#holo2)"/>
    <ellipse cx="400" cy="400" rx="130" ry="44" transform="rotate(12 400 400)" stroke="url(#holo3)"/>
    <ellipse cx="400" cy="400" rx="130" ry="44" transform="rotate(24 400 400)" stroke="url(#holo1)"/>
    <ellipse cx="400" cy="400" rx="130" ry="44" transform="rotate(36 400 400)" stroke="url(#holo2)"/>
    <ellipse cx="400" cy="400" rx="130" ry="44" transform="rotate(48 400 400)" stroke="url(#holo3)"/>
    <ellipse cx="400" cy="400" rx="130" ry="44" transform="rotate(60 400 400)" stroke="url(#holo1)"/>
    <ellipse cx="400" cy="400" rx="130" ry="44" transform="rotate(72 400 400)" stroke="url(#holo2)"/>
    <ellipse cx="400" cy="400" rx="130" ry="44" transform="rotate(84 400 400)" stroke="url(#holo3)"/>
    <ellipse cx="400" cy="400" rx="130" ry="44" transform="rotate(96 400 400)" stroke="url(#holo1)"/>
    <ellipse cx="400" cy="400" rx="130" ry="44" transform="rotate(108 400 400)" stroke="url(#holo2)"/>
    <ellipse cx="400" cy="400" rx="130" ry="44" transform="rotate(120 400 400)" stroke="url(#holo3)"/>
    <ellipse cx="400" cy="400" rx="130" ry="44" transform="rotate(132 400 400)" stroke="url(#holo1)"/>
    <ellipse cx="400" cy="400" rx="130" ry="44" transform="rotate(144 400 400)" stroke="url(#holo2)"/>
    <ellipse cx="400" cy="400" rx="130" ry="44" transform="rotate(156 400 400)" stroke="url(#holo3)"/>
    <ellipse cx="400" cy="400" rx="130" ry="44" transform="rotate(168 400 400)" stroke="url(#holo1)"/>
  </g>

  <!-- Ring 5 — outer weave -->
  <g opacity="0.50" fill="none" stroke-width="0.50">
    <ellipse cx="400" cy="400" rx="168" ry="52" transform="rotate(0  400 400)" stroke="url(#holo3)"/>
    <ellipse cx="400" cy="400" rx="168" ry="52" transform="rotate(10 400 400)" stroke="url(#holo1)"/>
    <ellipse cx="400" cy="400" rx="168" ry="52" transform="rotate(20 400 400)" stroke="url(#holo2)"/>
    <ellipse cx="400" cy="400" rx="168" ry="52" transform="rotate(30 400 400)" stroke="url(#holo3)"/>
    <ellipse cx="400" cy="400" rx="168" ry="52" transform="rotate(40 400 400)" stroke="url(#holo1)"/>
    <ellipse cx="400" cy="400" rx="168" ry="52" transform="rotate(50 400 400)" stroke="url(#holo2)"/>
    <ellipse cx="400" cy="400" rx="168" ry="52" transform="rotate(60 400 400)" stroke="url(#holo3)"/>
    <ellipse cx="400" cy="400" rx="168" ry="52" transform="rotate(70 400 400)" stroke="url(#holo1)"/>
    <ellipse cx="400" cy="400" rx="168" ry="52" transform="rotate(80 400 400)" stroke="url(#holo2)"/>
    <ellipse cx="400" cy="400" rx="168" ry="52" transform="rotate(90 400 400)" stroke="url(#holo3)"/>
    <ellipse cx="400" cy="400" rx="168" ry="52" transform="rotate(100 400 400)" stroke="url(#holo1)"/>
    <ellipse cx="400" cy="400" rx="168" ry="52" transform="rotate(110 400 400)" stroke="url(#holo2)"/>
    <ellipse cx="400" cy="400" rx="168" ry="52" transform="rotate(120 400 400)" stroke="url(#holo3)"/>
    <ellipse cx="400" cy="400" rx="168" ry="52" transform="rotate(130 400 400)" stroke="url(#holo1)"/>
    <ellipse cx="400" cy="400" rx="168" ry="52" transform="rotate(140 400 400)" stroke="url(#holo2)"/>
    <ellipse cx="400" cy="400" rx="168" ry="52" transform="rotate(150 400 400)" stroke="url(#holo3)"/>
    <ellipse cx="400" cy="400" rx="168" ry="52" transform="rotate(160 400 400)" stroke="url(#holo1)"/>
    <ellipse cx="400" cy="400" rx="168" ry="52" transform="rotate(170 400 400)" stroke="url(#holo2)"/>
  </g>

  <!-- Ring 6 — outermost border weave -->
  <g opacity="0.42" fill="none" stroke-width="0.45">
    <ellipse cx="400" cy="400" rx="195" ry="58" transform="rotate(0   400 400)" stroke="url(#holo1)"/>
    <ellipse cx="400" cy="400" rx="195" ry="58" transform="rotate(9   400 400)" stroke="url(#holo2)"/>
    <ellipse cx="400" cy="400" rx="195" ry="58" transform="rotate(18  400 400)" stroke="url(#holo3)"/>
    <ellipse cx="400" cy="400" rx="195" ry="58" transform="rotate(27  400 400)" stroke="url(#holo1)"/>
    <ellipse cx="400" cy="400" rx="195" ry="58" transform="rotate(36  400 400)" stroke="url(#holo2)"/>
    <ellipse cx="400" cy="400" rx="195" ry="58" transform="rotate(45  400 400)" stroke="url(#holo3)"/>
    <ellipse cx="400" cy="400" rx="195" ry="58" transform="rotate(54  400 400)" stroke="url(#holo1)"/>
    <ellipse cx="400" cy="400" rx="195" ry="58" transform="rotate(63  400 400)" stroke="url(#holo2)"/>
    <ellipse cx="400" cy="400" rx="195" ry="58" transform="rotate(72  400 400)" stroke="url(#holo3)"/>
    <ellipse cx="400" cy="400" rx="195" ry="58" transform="rotate(81  400 400)" stroke="url(#holo1)"/>
    <ellipse cx="400" cy="400" rx="195" ry="58" transform="rotate(90  400 400)" stroke="url(#holo2)"/>
    <ellipse cx="400" cy="400" rx="195" ry="58" transform="rotate(99  400 400)" stroke="url(#holo3)"/>
    <ellipse cx="400" cy="400" rx="195" ry="58" transform="rotate(108 400 400)" stroke="url(#holo1)"/>
    <ellipse cx="400" cy="400" rx="195" ry="58" transform="rotate(117 400 400)" stroke="url(#holo2)"/>
    <ellipse cx="400" cy="400" rx="195" ry="58" transform="rotate(126 400 400)" stroke="url(#holo3)"/>
    <ellipse cx="400" cy="400" rx="195" ry="58" transform="rotate(135 400 400)" stroke="url(#holo1)"/>
    <ellipse cx="400" cy="400" rx="195" ry="58" transform="rotate(144 400 400)" stroke="url(#holo2)"/>
    <ellipse cx="400" cy="400" rx="195" ry="58" transform="rotate(153 400 400)" stroke="url(#holo3)"/>
    <ellipse cx="400" cy="400" rx="195" ry="58" transform="rotate(162 400 400)" stroke="url(#holo1)"/>
    <ellipse cx="400" cy="400" rx="195" ry="58" transform="rotate(171 400 400)" stroke="url(#holo2)"/>
  </g>

  <!-- Shine overlay -->
  <rect width="800" height="800" fill="url(#shine)"/>

</svg>
